<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduler</title>

    <link rel = "stylesheet" href = "styles/appointment-styles.css">

    <script src="scripts/scheduler.js" defer></script>


</head>
<body>
    <div id = "main">

        <div id = "header">
        <h1>Appointment Scheduler</h1>
        </div>

    <form id="appointment-form" action="/submit-appointment" method="post">

        <fieldset>

        <h2>Book an Appointment</h2>
        
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname">
        <span class="err" id="err-fname">First name is required</span>
                
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname">
        <span class="err" id="err-lname">Last name is required</span>

        <label for = "date">Date</label>
        <input type="date" id="date" name="date">
        
        <label for = "time">Time</label>
        <input type="time" id="time" name="time">

        </fieldset>

        <button type="submit" id="appointment-button">Place Appointment</button>
    </form>
    </div>
</body>
</html>
